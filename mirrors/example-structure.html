<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<link rel="canonical" href="{{ORIGINAL_URL}}">
<meta name="description" content="{{DESCRIPTION}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:url" content="{{ORIGINAL_URL}}">
<meta property="article:published_time" content="2026-11-14T00:00:00Z">
</head>
<body>
<header>
<h1>{{TITLE}}</h1>
<p><time class="dt-published" datetime="2026-11-14T00:00:00Z">2026-11-14</time></p>
</header>
<article>
<!-- The <article> contains only the content of ONE original blog post. -->
<!-- Replace this comment with the post's real headings, paragraphs, -->
<!-- lists, blockquotes, and <img> elements (absolute https:// URLs). -->
<!-- Keep all text. Do not summarise or shorten it. -->
<h2>{{HEADING}}</h2>
<p>{{PARAGRAPH}}</p>
<ul>
<li>{{BULLET}}</li>
</ul>
<blockquote>
<p>{{QUOTE}}</p>
</blockquote>
<figure>
<img src="{{ABSOLUTE_IMAGE_URL}}" alt="{{IMAGE_ALT_TEXT}}">
<figcaption>{{IMAGE_CAPTION}}</figcaption>
</figure>
</article>
</body>
</html>
